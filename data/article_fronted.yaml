# ============================================================
# SL Blog 文章模块 - 前台接口自动化测试用例
# ============================================================
# 前台接口（无需认证）：
#   1. GET  /api/fronted/articles/{id}   - 获取文章详情（自动增加阅读量）
#   2. GET  /api/articles/latest         - 获取最新已发布文章列表（分页）
#   3. GET  /api/articles/popular        - 获取热门文章（按阅读量降序）
#   4. GET  /api/articles/new_article    - 获取最新创建的文章
# ============================================================

article_fronted_list:
  # 接口的基本信息
  - request_info:
      case_title: 获取最新已发布文章列表
      url: /api/articles/latest
      method: GET
      headers:
        Content-Type: application/json
    case_info:
      # 用例1: 默认分页获取最新已发布文章列表
      - case_desc: 默认分页
        params:
          page: 1
          pageSize: 10
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取最新文章成功 ]
          - gte: [ $.data.totalItems, 0 ]

      # 用例2: 自定义分页大小获取文章列表
      - case_desc: 自定义分页
        params:
          page: 1
          pageSize: 5
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取最新文章成功 ]
          - gte: [ $.data.totalItems, 0 ]

      # 用例3: 获取第二页文章列表
      - case_desc: 获取第二页
        params:
          page: 2
          pageSize: 10
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取最新文章成功 ]

article_fronted_popular:
  # 接口的基本信息
  - request_info:
      case_title: 获取热门文章
      url: /api/articles/popular
      method: GET
      headers:
        Content-Type: application/json
    case_info:
      # 用例1: 默认获取5篇热门文章
      - case_desc: 默认5篇
        params:
          limit: 5
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取热门文章成功 ]

      # 用例2: 自定义获取3篇热门文章
      - case_desc: 自定义3篇
        params:
          limit: 3
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取热门文章成功 ]

      # 用例3: 获取10篇热门文章
      - case_desc: 获取10篇
        params:
          limit: 10
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取热门文章成功 ]

article_fronted_new:
  # 接口的基本信息
  - request_info:
      case_title: 获取最新创建文章
      url: /api/articles/new_article
      method: GET
      headers:
        Content-Type: application/json
    case_info:
      # 用例1: 默认获取7篇最新文章
      - case_desc: 默认7篇
        params:
          limit: 7
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取最近新增的文章成功 ]

      # 用例2: 自定义获取5篇最新文章
      - case_desc: 自定义5篇
        params:
          limit: 5
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取最近新增的文章成功 ]

article_fronted_detail:
  # 接口的基本信息 - 需要先登录获取文章ID后使用动态变量
  # 注意: 此接口需要在有已发布文章存在时才能测试成功
  # 前台文章详情会自动增加阅读量
  - request_info:
      case_title: 获取前台文章详情
      url: /api/fronted/articles/${get_extract_value(article_id)}
      method: GET
      headers:
        Content-Type: application/json
    case_info:
      # 用例1: 获取已发布文章详情（article_id 从后台列表接口提取）
      - case_desc: 获取详情
        params: {}
        validate:
          - eq: [ $.code, 200 ]
          - eq: [ $.message, 获取文章详情成功 ]
          - contains: [ $.data.title, '${get_extract_value(article_title)}' ]
